services:
  - type: web
    name: diyface
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: waitress-serve --listen=0.0.0.0:$PORT diyface.app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DIYFACE_ASSETS
        value: /opt/render/project/src/assets
    healthCheckPath: /healthz
