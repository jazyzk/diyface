[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diyface"
version = "0.1.0"
description = "分层 DIY 头像生成器：FastAPI + Pillow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jazyzk" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "pillow>=10.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diyface"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
