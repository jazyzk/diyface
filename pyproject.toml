[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diyface"
version = "0.2.0"
description = "虚拟头像设计系统：Flask + Pillow 分层渲染"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jazyzk" }]
dependencies = [
  "flask>=3.0",
  "jinja2>=3.1",
  "pillow>=10.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diyface"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["tests/reports", "tests/fixtures", ".venv", "build", "dist"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
