<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        --ink: #1f2430;
        --muted: #6b7280;
        --line: #e3e7ef;
        --panel: #ffffff;
        --accent: #3b6ef5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #f2f5ff 0%, #f7f8fb 38%, #f4f5f8 100%);
        min-height: 100vh;
      }
      header {
        display: flex; align-items: baseline; gap: 16px;
        padding: 28px 40px 8px;
      }
      h1 { margin: 0; font-size: 30px; letter-spacing: 1px; }
      .sub { color: var(--muted); font-size: 14px; }
      .back { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 14px; }
      main {
        display: grid;
        grid-template-columns: minmax(0, 560px) 320px;
        gap: 24px;
        padding: 12px 40px 40px;
        align-items: start;
      }
      .board-wrap {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 18px; padding: 16px;
        box-shadow: 0 18px 40px rgba(31, 36, 48, .06);
      }
      .board-grid {
        display: grid;
        grid-template-columns: 22px 512px;
        grid-template-rows: 18px 512px;
        gap: 2px;
        width: max-content;
      }
      .ruler {
        display: grid;
        font-size: 9px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        user-select: none;
      }
      .ruler-x {
        grid-area: 1 / 2;
        grid-template-columns: repeat(32, 16px);
        align-items: end;
        justify-items: center;
      }
      .ruler-y {
        grid-area: 2 / 1;
        grid-template-rows: repeat(32, 16px);
        align-items: center;
        justify-items: end;
      }
      .ruler span { line-height: 1; }
      .ruler span.is-major { color: var(--ink); font-weight: 700; }
      .ruler-corner { grid-area: 1 / 1; }

      canvas {
        grid-area: 2 / 2;
        display: block; width: 512px; height: 512px;
        image-rendering: pixelated;
        border-radius: 12px;
        background:
          linear-gradient(45deg, #eef1f7 25%, transparent 25%, transparent 75%, #eef1f7 75%) 0 0 / 24px 24px,
          linear-gradient(45deg, #eef1f7 25%, #fff 25%, #fff 75%, #eef1f7 75%) 12px 12px / 24px 24px;
        touch-action: none;
        cursor: crosshair;
      }
      .hint { margin-top: 10px; color: var(--muted); font-size: 13px; }
      .side { display: grid; gap: 16px; }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 18px; padding: 16px;
        box-shadow: 0 18px 40px rgba(31, 36, 48, .05);
      }
      .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
      .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
      .swatch {
        position: relative;
        aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent;
        cursor: pointer; padding: 0;
      }
      .swatch-code {
        position: absolute;
        right: 3px;
        bottom: 1px;
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        pointer-events: none;
        letter-spacing: .2px;
      }
      .color-info {
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .swatch[aria-pressed="true"] { border-color: var(--ink); }
      .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      button {
        font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 10px;
        border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--ink);
      }
      button:hover { border-color: #c8d2e6; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button[aria-pressed="true"] { background: #e8efff; border-color: var(--accent); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .status { font-size: 13px; color: var(--muted); min-height: 18px; }
      @media (max-width: 900px) {
        main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 32px; }
        header { padding: 20px 16px 4px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>拼豆画布</h1>
      <span class="sub">32 × 32 · 点一下填一格</span>
      <a class="back" href="/">← 回到头像编辑器</a>
    </header>

    <main>
      <section class="board-wrap">
        <div class="board-grid">
          <div class="ruler-corner"></div>
          <div class="ruler ruler-x" id="ruler-x" aria-hidden="true"></div>
          <div class="ruler ruler-y" id="ruler-y" aria-hidden="true"></div>
          <canvas id="board" width="512" height="512" aria-label="32x32 拼豆画布"></canvas>
        </div>
        <p class="hint">
          按住拖动可以连续涂；快捷键 B 画笔 / E 橡皮 / G 油漆桶 / Ctrl+Z 撤销
        </p>
        <p class="hint" id="cursor-info">列 — · 行 —</p>
      </section>

      <section class="side">
        <div class="card">
          <h2>颜色</h2>
          <div class="palette" id="palette"></div>
          <p class="color-info" id="color-info"></p>
        </div>

        <div class="card">
          <h2>工具</h2>
          <div class="tools">
            <button type="button" data-tool="pen" aria-pressed="true">画笔</button>
            <button type="button" data-tool="eraser">橡皮</button>
            <button type="button" data-tool="bucket">油漆桶</button>
            <button type="button" id="undo">撤销</button>
          </div>
          <div class="row" style="margin-top: 10px">
            <button type="button" id="clear">清空</button>
            <button type="button" id="style-toggle" aria-pressed="false">换成方块</button>
          </div>
        </div>

        <div class="card">
          <h2>导出</h2>
          <div class="row">
            <button type="button" class="primary" id="download-1024">下载 1024</button>
            <button type="button" id="download-256">下载 256</button>
          </div>
          <div class="row" style="margin-top: 8px">
            <button type="button" id="share">复制分享链接</button>
            <button type="button" class="primary" id="to-avatar">贴到头像上</button>
          </div>
          <p class="status" id="status"></p>
        </div>
      </section>
    </main>

    <script type="module" src="/static/pixel.js"></script>
  </body>
</html>
